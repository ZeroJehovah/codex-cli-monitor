<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>需要访问凭证 · CLI Monitor</title>
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/dashboard.css">
</head>
<body>
  <main class="monitor access">
    <img src="/web/icon.svg" width="40" height="40" alt="">
    <h1>需要有效的访问凭证</h1>
    <p>请使用带有读取 token 的完整链接打开面板。</p>
    <code>/?token=你的读取TOKEN</code>
    <p>token 与 Windows 悬浮窗使用的读取凭证相同。若链接仍无法访问，请检查 token 是否正确，以及服务是否已配置读取凭证。</p>
  </main>
</body>
</html>
